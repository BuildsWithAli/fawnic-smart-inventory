databases:
  - name: fawnic-db
    plan: free

services:
  - type: web
    name: fawnic-backend
    runtime: python
    plan: free
    rootDir: backend
    # seed_data is idempotent (get_or_create guards) so it is safe to run on
    # every deploy; it gives the free tier (no Shell access) a login + demo data.
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fawnic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # settings.py trusts Render's auto-injected RENDER_EXTERNAL_HOSTNAME, so
      # this only needs a real value if you add a custom domain later.
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      # Set manually in the Render dashboard — never written to this file.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
